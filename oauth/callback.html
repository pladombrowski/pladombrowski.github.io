<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Voltando para o aplicativo…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #001e39;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .container {
        max-width: 420px;
        padding: 32px 24px;
        text-align: center;
      }
      .container a {
        color: #ffa033;
      }
      .muted {
        color: #b8c4d0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Voltando para o aplicativo…</h1>
      <p class="muted" id="status">Abrindo o aplicativo Haila.</p>
    </div>
    <script>
      /*
       * Bridge web -> app nativo para o callback OAuth.
       * Mesmo papel de `haila-condo-front/web/oauth/callback.html`, porem com o
       * scheme resolvido pelo host (ver src/config/deep-links.ts ->
       * OAUTH_CALLBACK_SCHEMES).
       */
      (function () {
        var schemes = {
          'hauser.haila.space': 'com.hauser.seguranca',
          'web.haila.app': 'com.haila.space',
          'haila.space': 'com.haila.space',
          'monking.play': 'com.monking.play',
          'caldeira.app': 'com.caldeira.app'
        };
        var scheme = schemes[window.location.hostname] || 'com.haila.space';

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var error = params.get('error');
        var errorDescription = params.get('error_description');

        var redirectUrl = scheme + '://oauth';
        if (code) {
          redirectUrl += '?code=' + encodeURIComponent(code);
        } else if (error) {
          redirectUrl += '?error=' + encodeURIComponent(error);
          if (errorDescription) {
            redirectUrl += '&error_description=' + encodeURIComponent(errorDescription);
          }
        } else if (window.location.search) {
          redirectUrl += window.location.search;
        }

        try {
          window.location.href = redirectUrl;
        } catch (e) {
          /* segue para o fallback abaixo */
        }

        setTimeout(function () {
          var status = document.getElementById('status');
          if (!status) return;
          status.innerHTML =
            'Se o aplicativo não abrir automaticamente, ' +
            '<a href="' +
            redirectUrl +
            '">toque aqui</a>.';
        }, 2000);
      })();
    </script>
  </body>
</html>
